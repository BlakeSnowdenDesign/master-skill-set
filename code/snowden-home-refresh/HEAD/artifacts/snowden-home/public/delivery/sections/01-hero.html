<style>html,body{margin:0;padding:0;background:#F3EDE3} .sd-first h2,.sd-first p,.sd-first figure{margin:0} .sd-first img{height:auto}

.sd-first {
  --sd-first-ink: #0a1d26;
  --sd-first-atl: #123440;
  --sd-first-teal: #16b3a6;
  --sd-first-aqua: #7fe0d4;
  --sd-first-mist: #eef3f4;
  --sd-first-snow: #fafcfc;
  --sd-first-amber: #f2a93b;
  --sd-first-slate: #4a5f68;
  --sd-first-line: rgba(10, 29, 38, .15);
  --sd-first-display: "Google Sans Flex", "Satoshi", system-ui, sans-serif;
  --sd-first-body: "Satoshi", system-ui, sans-serif;
  background: var(--sd-first-snow);
  color: var(--sd-first-ink);
  font: 16px/1.55 var(--sd-first-body);
  overflow: clip;
  -webkit-font-smoothing: antialiased;
}
.sd-first, .sd-first *, .sd-first *::before, .sd-first *::after { box-sizing: border-box; }
.sd-first img { display: block; max-width: 100%; }
.sd-first a { color: inherit; text-decoration: none; }
.sd-first button { font: inherit; }
.sd-first :focus-visible { outline: 3px solid var(--sd-first-amber); outline-offset: 4px; }
.sd-first h1, .sd-first h2, .sd-first h3, .sd-first p, .sd-first figure { margin-top: 0; }
.sd-first-skip {
  position: fixed; z-index: 1000; top: 8px; left: 8px; padding: 12px 16px;
  background: var(--sd-first-aqua); color: var(--sd-first-ink); transform: translateY(-160%);
}
.sd-first-skip:focus { transform: none; }
.sd-first-header { position: sticky; z-index: 80; top: 0; background: rgba(10,29,38,.96); color: var(--sd-first-snow); border-bottom: 1px solid rgba(127,224,212,.16); }
.sd-first-header__inner { max-width: 1440px; height: 76px; margin: 0 auto; padding: 0 clamp(22px,5vw,74px); display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.sd-first-brand { display: inline-flex; align-items: center; gap: 12px; font-family: var(--sd-first-display); font-size: 17px; font-weight: 700; letter-spacing: -.035em; }
.sd-first-brand img { width: 42px; height: 36px; object-fit: contain; }
.sd-first-brand i { color: var(--sd-first-aqua); font-style: normal; font-weight: 450; }
.sd-first-nav { display: flex; align-items: center; gap: clamp(12px,2vw,32px); }
.sd-first-nav > a { min-height: 44px; display: inline-flex; align-items: center; color: rgba(250,252,252,.76); font-size: 13px; transition: color .2s ease; }
.sd-first-nav > a:hover { color: var(--sd-first-aqua); }
.sd-first-nav .sd-first-nav__contact { gap: 10px; padding-left: 20px; color: var(--sd-first-aqua); }
.sd-first-nav__contact svg, .sd-first-text-link svg, .sd-first-cap a svg, .sd-first-outline-link svg, .sd-first-contact a svg, .sd-first-footer svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sd-first-menu-toggle { display: none; }
.sd-first-hero { min-height: 660px; padding: 92px max(6.25vw, calc((100vw - 1320px)/2)) 0; background: var(--sd-first-ink); color: var(--sd-first-snow); position: relative; overflow: hidden; }
.sd-first-hero__grain, .sd-first-contact__texture { position: absolute; inset: 0; pointer-events: none; opacity: .11; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E"); }
.sd-first-hero::before { content: ""; position: absolute; width: 66vw; height: 66vw; top: -45vw; right: -15vw; border: 1px solid rgba(127,224,212,.11); border-radius: 50%; box-shadow: 0 0 0 6vw rgba(127,224,212,.025), 0 0 0 13vw rgba(127,224,212,.02); pointer-events: none; }
.sd-first-hero__inner { position: relative; max-width: 1320px; min-height: 440px; margin: auto; display: grid; grid-template-columns: 1.17fr .83fr; align-items: center; gap: 4vw; }
.sd-first-hero__copy { position: relative; z-index: 2; padding-bottom: 32px; animation: sd-first-rise .8s cubic-bezier(.2,.8,.2,1) both; }
.sd-first-kicker, .sd-first-label, .sd-first-index, .sd-first-image-index, .sd-first-caption-note, .sd-first-mongrain__image figcaption, .sd-first-coordinates, .sd-first-cap__num, .sd-first-report__top, .sd-first-report__bottom, .sd-first-steps li > span, .sd-first-contact__top { font-size: 10px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
.sd-first-kicker { color: var(--sd-first-aqua); display: flex; align-items: center; gap: 11px; margin: 0 0 26px; }
.sd-first-status { width: 7px; height: 7px; border-radius: 100%; background: var(--sd-first-amber); box-shadow: 0 0 0 5px rgba(242,169,59,.11); }
.sd-first-hero h2 { font: 650 clamp(52px,7.2vw,104px)/.91 var(--sd-first-display); letter-spacing: -.075em; max-width: 850px; margin: 0; }
.sd-first-hero h2 em, .sd-first-section-head h2 em, .sd-first-aftercare h2 em, .sd-first-process h2 em, .sd-first-contact h2 em { color: var(--sd-first-aqua); font-style: normal; }
.sd-first-hero__bottom { margin-top: 36px; display: flex; align-items: end; gap: 34px; }
.sd-first-hero__bottom > p { color: rgba(250,252,252,.67); max-width: 330px; margin: 0; font-size: 16px; }
.sd-first-text-link { min-height: 46px; display: inline-flex; align-items: center; gap: 14px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.sd-first-text-link svg { transition: transform .25s ease; }
.sd-first-text-link:hover svg { transform: translateX(5px); }
.sd-first-hero__mark { align-self: stretch; min-height: 385px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; margin: 0; animation: sd-first-rise .9s .12s cubic-bezier(.2,.8,.2,1) both; }
.sd-first-hero__mark::before { content: ""; position: absolute; width: 80%; aspect-ratio: 1; border: 1px solid rgba(127,224,212,.15); border-radius: 50%; }
.sd-first-hero__mark img { position: relative; width: min(100%, 420px); filter: drop-shadow(0 35px 38px rgba(0,0,0,.38)); }
.sd-first-hero__mark figcaption { width: 100%; position: absolute; bottom: 14px; display: flex; justify-content: space-between; color: rgba(250,252,252,.42); font-size: 9px; letter-spacing: .11em; text-transform: uppercase; }
.sd-first-hero__mark figcaption span:first-child { color: var(--sd-first-aqua); }
.sd-first-index { position: relative; max-width: 1320px; height: 76px; border-top: 1px solid rgba(127,224,212,.2); margin: 30px auto 0; display: flex; align-items: center; gap: 34px; color: rgba(250,252,252,.5); font-size: 9px; }
.sd-first-index > span:nth-child(2) { color: rgba(250,252,252,.8); }
.sd-first-index a { margin-left: auto; min-height: 44px; display: inline-flex; gap: 10px; align-items: center; color: var(--sd-first-aqua); }
.sd-first-index svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.6; }
.sd-first-section { max-width: 1440px; margin: 0 auto; padding: clamp(82px,10vw,142px) clamp(22px,6.25vw,90px); }
.sd-first-section-head { display: flex; align-items: end; justify-content: space-between; gap: 40px; margin-bottom: 48px; }
.sd-first-label { color: #0e7f76; margin: 0 0 18px; }
.sd-first-section-head h2, .sd-first-process h2 { font: 650 clamp(42px,6vw,74px)/.96 var(--sd-first-display); letter-spacing: -.065em; margin: 0; }
.sd-first-period { color: #0e9d91; }
.sd-first-section-head > p { max-width: 310px; margin: 0 0 4px; color: var(--sd-first-slate); font-size: 15px; }
.sd-first-feature { display: block; color: inherit; }
.sd-first-feature__visual, .sd-first-project__visual { overflow: hidden; position: relative; background: #dfe8e7; }
.sd-first-feature__visual { aspect-ratio: 2.05 / 1; }
.sd-first-feature__visual::after, .sd-first-project__visual::after { content: ""; inset: 0; position: absolute; background: linear-gradient(180deg,rgba(10,29,38,.28),transparent 25%,transparent 58%,rgba(10,29,38,.2)); pointer-events: none; }
.sd-first-feature__visual img, .sd-first-project__visual img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s cubic-bezier(.2,.8,.2,1); }
.sd-first-feature:hover img, .sd-first-project:hover img { transform: scale(1.025); }
.sd-first-image-index { position: absolute; z-index: 1; top: 20px; left: 22px; color: white; font-size: 9px; }
.sd-first-feature__arrow, .sd-first-project__arrow { z-index: 2; position: absolute; right: 20px; bottom: 20px; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; background: var(--sd-first-snow); color: var(--sd-first-ink); transition: transform .3s ease; }
.sd-first-feature:hover .sd-first-feature__arrow, .sd-first-project:hover .sd-first-project__arrow { transform: rotate(45deg); }
.sd-first-feature__arrow svg, .sd-first-project__arrow svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.5; }
.sd-first-feature__caption, .sd-first-project__caption { padding: 19px 2px 0; display: flex; justify-content: space-between; align-items: start; gap: 20px; }
.sd-first-feature__caption h3, .sd-first-project__caption h3 { font: 620 25px/1.12 var(--sd-first-display); letter-spacing: -.04em; margin: 0 0 5px; }
.sd-first-feature__caption p, .sd-first-project__caption p { color: var(--sd-first-slate); font-size: 14px; margin: 0; }
.sd-first-caption-note, .sd-first-project__caption > span { color: var(--sd-first-slate); font-size: 9px; padding-top: 6px; white-space: nowrap; }
.sd-first-project-pair { display: grid; grid-template-columns: .9fr 1.1fr; gap: clamp(24px,5vw,68px); margin-top: clamp(64px,8vw,112px); align-items: start; }
.sd-first-project--shadow { padding-top: 12%; }
.sd-first-project--shadow .sd-first-project__visual { aspect-ratio: 1.04 / 1; }
.sd-first-project--edge .sd-first-project__visual { aspect-ratio: 1.48 / 1; }
.sd-first-project__caption { padding-top: 16px; }
.sd-first-project__caption h3 { font-size: 22px; }
.sd-first-work-foot { border-top: 1px solid var(--sd-first-line); margin-top: 70px; padding-top: 18px; display: flex; justify-content: space-between; align-items: center; color: var(--sd-first-slate); font-size: 12px; }
.sd-first-work-foot .sd-first-text-link { color: var(--sd-first-ink); }

.sd-first-mongrain { position: relative; padding: clamp(72px,9vw,122px) clamp(22px,6.25vw,90px) 42px; background: var(--sd-first-atl); color: var(--sd-first-snow); overflow: hidden; }
.sd-first-mongrain::before { content: "M"; position: absolute; right: -2vw; top: -18vw; color: rgba(127,224,212,.035); font: 600 58vw/.8 var(--sd-first-display); pointer-events: none; }
.sd-first-mongrain__intro, .sd-first-mongrain__image, .sd-first-mongrain__foot { position: relative; max-width: 1260px; margin-left: auto; margin-right: auto; }
.sd-first-label--light { color: var(--sd-first-aqua); }
.sd-first-label--light span { margin-left: 15px; color: rgba(250,252,252,.43); }
.sd-first-mongrain__headline { display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-bottom: 35px; }
.sd-first-mongrain__headline h2 { font: 650 clamp(52px,8.7vw,118px)/.85 var(--sd-first-display); letter-spacing: -.09em; margin: 0; }
.sd-first-mongrain__headline p { margin: 0 0 5px; color: rgba(250,252,252,.75); font-size: clamp(15px,2vw,21px); }
.sd-first-mongrain__image { margin-top: 0; margin-bottom: 0; border: 1px solid rgba(127,224,212,.25); background: #e7eeee; overflow: hidden; }
.sd-first-mongrain__image img { width: 100%; }
.sd-first-mongrain__image figcaption { position: absolute; inset: auto 0 0; display: flex; justify-content: space-between; gap: 20px; padding: 15px 19px; background: rgba(10,29,38,.82); color: rgba(250,252,252,.72); font-size: 8px; }
.sd-first-mongrain__image figcaption span:first-child { color: var(--sd-first-aqua); }
.sd-first-mongrain__foot { display: grid; grid-template-columns: minmax(260px, 1fr) auto auto; align-items: center; gap: 42px; padding-top: 27px; }
.sd-first-mongrain__foot > p { max-width: 600px; margin: 0; color: rgba(250,252,252,.72); font-size: 15px; }
.sd-first-outline-link { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 48px; border-bottom: 1px solid currentColor; color: var(--sd-first-aqua); font-size: 12px; font-weight: 700; white-space: nowrap; }
.sd-first-outline-link svg { width: 15px; height: 15px; transition: transform .2s ease; }
.sd-first-outline-link:hover svg { transform: translate(2px,-2px); }
.sd-first-coordinates { line-height: 1.8; color: rgba(250,252,252,.42); font-size: 8px; }

.sd-first-capabilities { padding-top: clamp(96px,12vw,168px); padding-bottom: clamp(96px,12vw,152px); }
.sd-first-section-head--cap { align-items: center; margin-bottom: 62px; }
.sd-first-section-head--cap h2 em { color: #0e7f76; }
.sd-first-section-head--cap > p { max-width: 360px; margin-bottom: 0; }
.sd-first-cap-grid { display: grid; grid-template-columns: repeat(4,1fr); border-top: 1px solid var(--sd-first-line); border-bottom: 1px solid var(--sd-first-line); }
.sd-first-cap { min-height: 345px; padding: 24px 22px 23px; position: relative; border-right: 1px solid var(--sd-first-line); display: flex; flex-direction: column; align-items: start; }

.sd-first-cap__num { color: #0e7f76; font-size: 9px; }
.sd-first-cap__glyph { height: 95px; display: flex; align-items: center; font: 500 56px/.9 var(--sd-first-display); letter-spacing: -.1em; color: #0e7f76; }
.sd-first-cap__glyph--type { font-size: 46px; letter-spacing: -.09em; }

.sd-first-cap__glyph--search { font: 300 70px/.8 var(--sd-first-body); transform: rotate(-20deg); }
.sd-first-cap h3 { font: 620 20px/1.15 var(--sd-first-display); letter-spacing: -.035em; margin: 0 0 12px; }
.sd-first-cap p { color: var(--sd-first-slate); font-size: 13px; line-height: 1.65; margin: 0 0 24px; }
.sd-first-cap a { display: flex; align-items: center; gap: 10px; margin-top: auto; min-height: 44px; font-size: 11px; font-weight: 700; }
.sd-first-cap a svg { transition: transform .2s ease; }
.sd-first-cap a:hover svg { transform: translateX(4px); }
.sd-first-cap-note { display: flex; gap: 45px; border-bottom: 1px solid var(--sd-first-line); padding: 20px 0; color: #0e7f76; font-size: 9px; }
.sd-first-cap-note > span { white-space: nowrap; }
.sd-first-cap-note p { color: var(--sd-first-slate); font-size: 12px; letter-spacing: 0; text-transform: none; font-weight: 400; margin: 0; }

.sd-first-aftercare { background: var(--sd-first-mist); padding: clamp(78px,9vw,125px) max(6.25vw, calc((100vw - 1260px)/2)); display: grid; grid-template-columns: .85fr 1.15fr; gap: clamp(40px,8vw,110px); }
.sd-first-aftercare__left { padding: 5px 0 0; }
.sd-first-aftercare h2 { font: 650 clamp(44px,6.2vw,77px)/.96 var(--sd-first-display); letter-spacing: -.067em; margin: 0 0 24px; }

.sd-first-aftercare__intro { color: var(--sd-first-slate); max-width: 360px; margin: 0 0 24px; }
.sd-first-aftercare__left .sd-first-outline-link { color: var(--sd-first-ink); }
.sd-first-aftercare__list { border-top: 1px solid var(--sd-first-line); }
.sd-first-aftercare__list > div { padding: 17px 0; border-bottom: 1px solid var(--sd-first-line); display: grid; grid-template-columns: 38px 110px 1fr; align-items: baseline; gap: 8px; }
.sd-first-aftercare__list span { color: #0e7f76; font-size: 9px; letter-spacing: .12em; }
.sd-first-aftercare__list b { font: 650 16px var(--sd-first-display); }
.sd-first-aftercare__list p { color: var(--sd-first-slate); font-size: 12px; margin: 0; }

.sd-first-report__top span:last-child, .sd-first-report__bottom span:last-child { color: #0e7f76; }
.sd-first-report__title { font: 620 20px/1.12 var(--sd-first-display); margin-top: 22px; }
.sd-first-report__chart { position: relative; height: 94px; margin-top: 6px; }
.sd-first-report__chart::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(to bottom,transparent 0,transparent 22px,rgba(10,29,38,.09) 23px,transparent 24px); }
.sd-first-report__bars { position: absolute; inset: 6px 0 0; display: flex; align-items: end; justify-content: space-between; gap: 7px; }
.sd-first-report__bars i { flex: 1; height: 32%; background: rgba(22,179,166,.16); }
.sd-first-report__bars i:nth-child(3n) { height: 63%; }
.sd-first-report__bars i:nth-child(4n) { height: 43%; }
.sd-first-report__bars i:nth-child(5n) { height: 76%; }
.sd-first-report__chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.sd-first-report__chart path { fill: none; stroke: #0e9d91; stroke-width: 2; vector-effect: non-scaling-stroke; }
.sd-first-report__bottom { border-top: 1px solid var(--sd-first-line); padding-top: 11px; }

.sd-first-process { padding-top: clamp(94px,12vw,162px); padding-bottom: clamp(96px,12vw,160px); }
.sd-first-process__heading { display: flex; justify-content: space-between; align-items: end; gap: 30px; margin-bottom: 68px; }
.sd-first-process__heading .sd-first-label { align-self: start; }
.sd-first-process h2 em { color: #0e7f76; }
.sd-first-steps { list-style: none; display: grid; grid-template-columns: repeat(4,1fr); padding: 0; margin: 0; border-top: 1px solid var(--sd-first-ink); }

.sd-first-steps li > span { color: #0e7f76; font-size: 9px; }
.sd-first-steps h3 { font: 620 20px var(--sd-first-display); letter-spacing: -.03em; margin: 20px 0 8px; }
.sd-first-steps p { color: var(--sd-first-slate); font-size: 13px; margin: 0; }
.sd-first-contact { position: relative; overflow: hidden; background: var(--sd-first-ink); color: var(--sd-first-snow); padding: 0 clamp(22px,6.25vw,90px); }
.sd-first-contact::before { content: ""; position: absolute; width: 56vw; height: 56vw; right: -8vw; bottom: -36vw; border: 1px solid rgba(127,224,212,.14); border-radius: 50%; box-shadow: 0 0 0 5vw rgba(127,224,212,.025),0 0 0 12vw rgba(127,224,212,.02); }
.sd-first-contact__inner { position: relative; max-width: 1260px; padding: 26px 0 0; margin: auto; }
.sd-first-contact__top { min-height: 55px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(127,224,212,.18); color: rgba(250,252,252,.53); font-size: 8px; }
.sd-first-contact .sd-first-label { margin-top: clamp(65px,8vw,106px); margin-bottom: 21px; }
.sd-first-contact h2 { font: 650 clamp(62px,10vw,132px)/.87 var(--sd-first-display); letter-spacing: -.085em; margin: 0; }
.sd-first-contact__copy { max-width: 440px; margin: 25px 0 27px; color: rgba(250,252,252,.69); font-size: 16px; }
.sd-first-contact__actions { display: flex; flex-wrap: wrap; gap: 12px; }
.sd-first-contact__actions a { min-height: 50px; padding: 0 19px; display: inline-flex; align-items: center; justify-content: center; gap: 14px; border: 1px solid rgba(250,252,252,.3); font-size: 12px; font-weight: 700; transition: background .2s ease, color .2s ease; }
.sd-first-contact__actions .sd-first-contact__primary { background: var(--sd-first-aqua); border-color: var(--sd-first-aqua); color: var(--sd-first-ink); }
.sd-first-contact__actions .sd-first-contact__primary:hover { background: var(--sd-first-snow); border-color: var(--sd-first-snow); }
.sd-first-contact__actions .sd-first-contact__secondary:hover { border-color: var(--sd-first-aqua); color: var(--sd-first-aqua); }
.sd-first-contact__bottom { border-top: 1px solid rgba(127,224,212,.18); margin-top: clamp(72px,9vw,120px); min-height: 70px; display: flex; justify-content: space-between; align-items: center; gap: 15px; color: rgba(250,252,252,.5); font-size: 10px; }
.sd-first-contact__bottom a { color: rgba(250,252,252,.78); display: inline-flex; align-items: center; gap: 7px; min-height: 44px; }
.sd-first-contact__bottom a:hover { color: var(--sd-first-aqua); }
.sd-first-backtop { font-family: var(--sd-first-display); font-weight: 700; }
.sd-first-backtop span { color: var(--sd-first-aqua); font-size: 18px; }
.sd-first-footer { max-width: 1440px; margin: auto; min-height: 60px; padding: 12px clamp(22px,6.25vw,90px); display: flex; align-items: center; justify-content: space-between; gap: 16px; color: var(--sd-first-slate); font-size: 10px; }
.sd-first-footer a:hover { color: #0e7f76; }
