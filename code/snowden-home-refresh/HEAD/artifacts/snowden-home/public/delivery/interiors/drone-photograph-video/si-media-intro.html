<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:description" content="Photography, business video and aerial storytelling planned around your website and audience. Talk with Snowden Design about your location and creative brief.">

<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#F3EDE3}
.sd-root{--sd-ink:#0A1D26;--sd-atl:#123440;--sd-teal:#16B3A6;--sd-aqua:#7FE0D4;--sd-mist:#EEF3F4;--sd-snow:#FAFCFC;--sd-amber:#F2A93B;--sd-slate:#4A5F68;--sd-line:rgba(10,29,38,.12);
--sd-ease:cubic-bezier(.2,.8,.2,1);--sd-d:"Google Sans Flex","Satoshi",system-ui,sans-serif;--sd-b:"Satoshi",system-ui,sans-serif;
--sd-sh:0 1px 2px rgba(10,29,38,.06),0 24px 60px -24px rgba(10,29,38,.28);
background:var(--sd-snow);color:var(--sd-ink);font-family:var(--sd-b);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
.sd-root *,.sd-root *::before,.sd-root *::after{box-sizing:border-box}
.sd-root img{display:block;max-width:100%}
.sd-root a{color:inherit}
.sd-root :focus-visible{outline:3px solid var(--sd-amber);outline-offset:3px;border-radius:10px}
.sd-wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.sd-mono{font-family:var(--sd-b);font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:12px}
.sd-h{font-family:var(--sd-d);font-weight:700;letter-spacing:-.03em;line-height:1.02;margin:0}
.sd-h2{font-size:clamp(32px,4.4vw,42px)}
.sd-eyebrow{display:flex;align-items:center;gap:10px;color:#0E7F76;margin-bottom:16px}
.sd-eyebrow::before{content:"";width:24px;height:2px;background:currentColor}
.sd-dark .sd-eyebrow{color:var(--sd-aqua)}
.sd-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:transform .45s var(--sd-ease),background .3s,color .3s,border-color .3s}
.sd-btn:hover{transform:translateY(-2px)}
.sd-btn svg{width:18px;height:18px;transition:transform .45s var(--sd-ease)}
.sd-btn:hover svg{transform:translateX(4px)}
.sd-btn--teal{background:var(--sd-teal);color:var(--sd-ink)}
.sd-btn--teal:hover{background:var(--sd-aqua)}
.sd-btn--ghost{color:var(--sd-snow);border-color:rgba(250,252,252,.32)}
.sd-btn--ghost:hover{background:rgba(250,252,252,.1)}
.sd-btn--ink{background:var(--sd-ink);color:var(--sd-snow)}
.sd-btn--line{border-color:var(--sd-ink);color:var(--sd-ink)}
.sd-btn--line:hover{background:var(--sd-ink);color:var(--sd-snow)}
.sd-sec{padding:120px 0 0}

/* HERO */
.sd-hero{position:relative;background:radial-gradient(90% 80% at 80% 20%,#1B5866 0%,transparent 60%),radial-gradient(70% 60% at 0% 100%,var(--sd-atl),transparent 65%),var(--sd-ink);color:var(--sd-snow);overflow:hidden;padding:96px 0 0}
.sd-hero__grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(127,224,212,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(127,224,212,.07) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(80% 70% at 65% 35%,#000 20%,transparent 80%);mask-image:radial-gradient(80% 70% at 65% 35%,#000 20%,transparent 80%)}
.sd-hero__in{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.sd-hero__tag{display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;border:1px solid rgba(127,224,212,.25);color:var(--sd-aqua);margin-bottom:28px}
.sd-dot{width:7px;height:7px;border-radius:50%;background:var(--sd-amber)}
.sd-hero__title{font-size:clamp(42px,6.2vw,72px);line-height:.98}
.sd-hero__title em{font-style:normal;color:var(--sd-aqua)}
.sd-hero__sub{max-width:540px;margin:26px 0 34px;font-size:19px;color:rgba(250,252,252,.8)}
.sd-hero__ctas{display:flex;flex-wrap:wrap;gap:12px}
.sd-hero__logo{position:relative;perspective:900px}
.sd-hero__logo img{width:100%;max-width:520px;margin:0 auto;filter:drop-shadow(0 40px 60px rgba(0,0,0,.55));transition:transform .6s var(--sd-ease);transform:rotateY(var(--sd-rx,0deg)) rotateX(var(--sd-ry,0deg))}
.sd-hero__caps{position:relative;margin-top:72px;border-top:1px solid rgba(127,224,212,.18);display:grid;grid-template-columns:repeat(6,1fr)}
.sd-hero__caps a{padding:22px 16px 26px;text-decoration:none;color:rgba(250,252,252,.78);border-right:1px solid rgba(127,224,212,.12);font-weight:600;font-size:15px;min-height:44px;transition:background .3s,color .3s}
.sd-hero__caps a:last-child{border-right:0}
.sd-hero__caps a:hover{background:rgba(127,224,212,.08);color:var(--sd-aqua)}
.sd-hero__caps span{display:block;color:var(--sd-aqua);margin-bottom:6px;font-size:11px}

/* WORK */
.sd-head{display:flex;justify-content:space-between;align-items:end;gap:32px;margin-bottom:48px;flex-wrap:wrap}
.sd-head p{max-width:400px;margin:0;color:var(--sd-slate)}
.sd-work{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:22px}
.sd-proj{grid-column:auto;min-width:0;display:flex;flex-direction:column;text-decoration:none;background:#fff;border-radius:26px;padding:10px;box-shadow:var(--sd-sh);transition:transform .5s var(--sd-ease)}
.sd-proj:hover{transform:translateY(-6px)}
.sd-proj--wide,.sd-proj--side{grid-column:auto}
.sd-proj__img{flex:none;width:100%;border-radius:18px;overflow:hidden;aspect-ratio:16/10;background:var(--sd-mist)}
.sd-proj--side .sd-proj__img{aspect-ratio:16/10;flex:none;min-height:0}
.sd-proj__img img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform 1.2s var(--sd-ease)}
.sd-proj:hover .sd-proj__img img{transform:scale(1.04)}
.sd-proj__meta{flex:1;display:flex;flex-direction:column;padding:20px 14px 12px}
.sd-proj__meta > :last-child{margin-top:auto;padding-top:14px}
.sd-proj__meta .sd-mono{color:var(--sd-slate);font-size:11px}
.sd-proj__meta svg{width:16px;height:16px;vertical-align:middle;margin-left:6px}
.sd-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.sd-proj h3{font-size:26px;margin:8px 0 6px}
.sd-proj p{margin:0;color:var(--sd-slate);font-size:15.5px}

/* MONGRAIN */
.sd-mg{margin-top:120px;background:var(--sd-ink);color:var(--sd-snow);padding:110px 0}
.sd-mg__grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:center}
.sd-mg p{color:rgba(250,252,252,.76)}
.sd-mg__stage{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.7);border:1px solid rgba(127,224,212,.2);perspective:1200px}
.sd-mg__stage img{width:100%;transition:transform .8s var(--sd-ease);transform-origin:50% 60%}
.sd-mg__band{position:absolute;left:0;right:0;border:2px solid var(--sd-aqua);background:rgba(127,224,212,.14);opacity:0;transition:opacity .4s}
.sd-mg__band[data-l="roof"]{top:6%;height:14%}.sd-mg__band[data-l="walls"]{top:14%;height:52%}.sd-mg__band[data-l="foundation"]{top:64%;height:30%}
.sd-mg[data-active="roof"] [data-l="roof"],.sd-mg[data-active="walls"] [data-l="walls"],.sd-mg[data-active="foundation"] [data-l="foundation"]{opacity:1}
.sd-mg[data-active="roof"] .sd-mg__stage img{transform:translateY(4%) scale(1.04)}
.sd-mg[data-active="foundation"] .sd-mg__stage img{transform:translateY(-4%) scale(1.04)}
.sd-mg__layers{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0}
.sd-mg__layers button{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid rgba(127,224,212,.35);background:transparent;color:var(--sd-snow);font:600 15px var(--sd-b);cursor:pointer;transition:background .3s,color .3s}
.sd-mg__layers button[aria-pressed="true"]{background:var(--sd-aqua);color:var(--sd-ink);border-color:var(--sd-aqua)}
.sd-mg__note{font-size:13px;color:rgba(250,252,252,.6)!important;border-left:2px solid var(--sd-amber);padding-left:12px}
.sd-mg__cap{min-height:52px;font-size:15px}

/* SERVICES */
.sd-svc{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--sd-line)}
.sd-svc article{padding:34px 28px 40px 0;border-bottom:1px solid var(--sd-line);position:relative}
.sd-svc article:not(:nth-child(3n)){border-right:1px solid var(--sd-line);margin-right:0}
.sd-svc article:nth-child(3n+2),.sd-svc article:nth-child(3n){padding-left:28px}
.sd-svc .sd-mono{color:#0E7F76}
.sd-svc h3{font-size:24px;margin:14px 0 10px}
.sd-svc p{margin:0;color:var(--sd-slate);font-size:15.5px}

/* CARE */
.sd-care{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:120px}
.sd-panel{border-radius:28px;padding:44px;background:var(--sd-mist)}
.sd-panel--dark{background:var(--sd-atl);color:var(--sd-snow)}
.sd-panel--dark p,.sd-panel--dark li{color:rgba(250,252,252,.8)}
.sd-panel ul{list-style:none;padding:0;margin:24px 0 30px}
.sd-panel li{padding:14px 0;border-top:1px solid var(--sd-line);display:flex;gap:14px}
.sd-panel--dark li{border-color:rgba(127,224,212,.18)}
.sd-panel li b{min-width:120px;font-weight:700}
.sd-panel p{color:var(--sd-slate)}
.sd-chart{background:#fff;border-radius:18px;padding:20px;margin:24px 0;box-shadow:var(--sd-sh)}
.sd-chart svg{width:100%;height:120px}
.sd-chart path{fill:none;stroke:var(--sd-teal);stroke-width:2.5;stroke-dasharray:900;stroke-dashoffset:0}
.sd-js .sd-r:not(.is-in) .sd-chart path{stroke-dashoffset:900}
.sd-chart path{transition:stroke-dashoffset 2s var(--sd-ease) .3s}
.sd-chart__k{display:flex;justify-content:space-between;color:var(--sd-slate)}

/* ABOUT */
.sd-about{display:grid;grid-template-columns:.85fr 1.15fr;gap:64px;align-items:center}
.sd-about__img{border-radius:28px;overflow:hidden;aspect-ratio:1;background:var(--sd-mist);box-shadow:var(--sd-sh)}
.sd-about__img img{width:100%;height:100%;object-fit:cover}
.sd-about p{color:var(--sd-slate);font-size:18px}
.sd-chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:24px 0 0}
.sd-chips li{padding:8px 14px;border-radius:999px;border:1px solid var(--sd-line);font-size:14px;font-weight:600}
.sd-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;list-style:none;padding:0;margin:64px 0 0}
.sd-steps li{border-top:2px solid var(--sd-ink);padding-top:18px}
.sd-steps b{display:block;font-family:var(--sd-d);font-size:21px;margin:6px 0}
.sd-steps p{margin:0;color:var(--sd-slate);font-size:15px}
.sd-steps .sd-mono{color:#0E7F76}

/* CTA */
.sd-cta{margin:120px 0 0;background:var(--sd-ink);color:var(--sd-snow);padding:100px 0;position:relative;overflow:hidden}
.sd-cta::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 90% at 100% 0%,rgba(22,179,166,.3),transparent 60%)}
.sd-cta .sd-wrap{position:relative}
.sd-cta h2{font-size:clamp(42px,6vw,72px);max-width:900px}
.sd-cta h2 em{font-style:normal;color:var(--sd-aqua)}
.sd-cta p{color:rgba(250,252,252,.78);max-width:560px;margin:22px 0 32px}
.sd-cta__row{display:flex;flex-wrap:wrap;gap:12px}

/* reveal: only hidden when JS present */
.sd-js .sd-r{opacity:0;transform:translateY(36px);transition:opacity 1s var(--sd-ease),transform 1s var(--sd-ease);transition-delay:var(--d,0s)}
.sd-js .sd-r.is-in{opacity:1;transform:none}
@keyframes sdUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.sd-in{animation:sdUp 1s var(--sd-ease) both;animation-delay:var(--d,0s)}

@media (max-width:980px){
.sd-hero__in,.sd-mg__grid,.sd-about,.sd-care{grid-template-columns:1fr}
.sd-hero__logo img{max-width:360px}
.sd-hero__caps{grid-template-columns:repeat(3,1fr)}
.sd-hero__caps a:nth-child(3){border-right:0}
.sd-svc{grid-template-columns:1fr 1fr}
.sd-svc article{padding:30px 22px!important;border-right:0!important}
.sd-svc article:nth-child(odd){border-right:1px solid var(--sd-line)!important}
.sd-steps{grid-template-columns:1fr 1fr}
.sd-work{grid-template-columns:minmax(0,1fr)}
.sd-proj,.sd-proj--wide,.sd-proj--side{grid-column:auto}
.sd-proj--side .sd-proj__img{aspect-ratio:16/10;flex:none;min-height:0}
}
@media (max-width:640px){
.sd-root{font-size:16px}.sd-wrap{padding:0 18px}.sd-sec{padding-top:88px}
.sd-hero{padding-top:64px}.sd-hero__caps{grid-template-columns:1fr 1fr}
.sd-hero__caps a{border-right:0!important;border-bottom:1px solid rgba(127,224,212,.12)}
.sd-hero__ctas .sd-btn,.sd-cta__row .sd-btn{width:100%}
.sd-svc,.sd-steps{grid-template-columns:1fr}.sd-svc article{border-right:0!important;padding:26px 0!important}
.sd-panel{padding:30px 22px}.sd-panel li{flex-direction:column;gap:2px}
.sd-mg{padding:80px 0}
}
@media (prefers-reduced-motion:reduce){
.sd-root *,.sd-root *::before,.sd-root *::after{animation:none!important;transition:none!important}
.sd-js .sd-r{opacity:1;transform:none}.sd-chart path{stroke-dashoffset:0!important}
}


.sd-photo,
.sd-photo *,
.sd-photo *::before,
.sd-photo *::after {
  box-sizing: border-box;
}

.sd-photo {
  --photo-ink: #0a1d26;
  --photo-atlantic: #123440;
  --photo-teal: #16b3a6;
  --photo-aqua: #7fe0d4;
  --photo-paper: #f3eee3;
  --photo-paper-light: #faf7ef;
  --photo-muted: #53656a;
  --photo-line: rgba(10, 29, 38, .17);
  --photo-display: "Google Sans Flex", "Satoshi", system-ui, sans-serif;
  --photo-body: "Satoshi", system-ui, sans-serif;
  position: relative;
  overflow: hidden;
  background: var(--photo-paper);
  color: var(--photo-ink);
  font: 16px/1.6 var(--photo-body);
  -webkit-font-smoothing: antialiased;
}

.sd-photo img {
  display: block;
  max-width: 100%;
  height: auto;
}

.sd-photo a {
  color: inherit;
}

.sd-photo :focus-visible {
  outline: 3px solid #b76835;
  outline-offset: 5px;
}

.sd-photo__inner {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, .92fr) minmax(310px, .78fr);
  column-gap: clamp(48px, 8vw, 124px);
  align-items: center;
  max-width: 1320px;
  margin: 0 auto;
  padding: clamp(82px, 10vw, 144px) clamp(24px, 6.2vw, 88px) 38px;
}

.sd-photo__iris {
  position: absolute;
  top: 0;
  right: 0;
  width: 75%;
  height: 50%;
  overflow: hidden;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(#000 65%, transparent);
  mask-image: linear-gradient(#000 65%, transparent);
}

.sd-photo__iris svg {
  position: absolute;
  top: clamp(-600px, -32vw, -220px);
  right: clamp(-330px, -15vw, -95px);
  width: clamp(560px, 85vw, 1400px);
  aspect-ratio: 1;
  overflow: visible;
}

.sd-photo__iris-rim {
  fill: none;
  stroke: rgba(18, 52, 64, .045);
  stroke-width: 24;
}

.sd-photo__iris-blade {
  fill: rgba(18, 52, 64, .035);
  stroke: rgba(18, 52, 64, .065);
  stroke-width: 1.5;
  stroke-linejoin: round;
  transform-origin: 0 0;
  animation: sd-photo-aperture 24s ease-in-out infinite;
  will-change: transform;
}

@keyframes sd-photo-aperture {
  0%, 100% { transform: rotate(-8deg) translateY(0); }
  50% { transform: rotate(18deg) translateY(-105px); }
}

.sd-photo__copy,
.sd-photo__figure,
.sd-photo__bottomline {
  position: relative;
  z-index: 1;
}

.sd-photo__eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 25px;
  color: #0e7f76;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .15em;
  text-transform: uppercase;
}

.sd-photo__eyebrow span {
  color: #bd7547;
}

.sd-photo h2 {
  margin: 0;
  font: 650 clamp(48px, 6.4vw, 82px)/.96 var(--photo-display);
  letter-spacing: -.075em;
}

.sd-photo h2 em {
  color: #0e7f76;
  font-style: normal;
}

.sd-photo__intro {
  max-width: 540px;
  margin: 26px 0 33px;
  color: #40545a;
  font-size: clamp(16px, 1.55vw, 19px);
  line-height: 1.62;
}

.sd-photo__disciplines {
  border-top: 1px solid var(--photo-line);
}

.sd-photo__discipline {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
  padding: 18px 0 17px;
  border-bottom: 1px solid var(--photo-line);
}

.sd-photo__index {
  padding-top: 4px;
  color: #0e7f76;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
}

.sd-photo__discipline h3 {
  margin: 0 0 4px;
  font: 650 20px/1.2 var(--photo-display);
  letter-spacing: -.035em;
}

.sd-photo__discipline p {
  max-width: 440px;
  margin: 0;
  color: var(--photo-muted);
  font-size: 14px;
  line-height: 1.55;
}

.sd-photo__note {
  max-width: 480px;
  margin: 19px 0 15px;
  color: var(--photo-muted);
  font-size: 12px;
  line-height: 1.55;
}

.sd-photo__contact {
  display: inline-flex;
  min-height: 48px;
  align-items: center;
  gap: 13px;
  color: var(--photo-ink);
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  border-bottom: 1px solid rgba(10, 29, 38, .55);
  transition: color .2s ease, border-color .2s ease;
}

.sd-photo__contact:hover {
  color: #0e7f76;
  border-color: currentColor;
}

.sd-photo__contact svg {
  width: 17px;
  height: 17px;
  transition: transform .25s ease;
}

.sd-photo__contact:hover svg {
  transform: translateX(4px);
}

.sd-photo__figure {
  width: 100%;
  max-width: 474px;
  justify-self: end;
  margin: 0;
}

.sd-photo__image {
  position: relative;
  overflow: hidden;
  background: #b88559;
  box-shadow: 17px 19px 0 rgba(18, 52, 64, .09);
}

.sd-photo__image::after {
  content: "";
  position: absolute;
  inset: 48% 0 0;
  background: linear-gradient(180deg, transparent, rgba(10, 29, 38, .22));
  pointer-events: none;
}

.sd-photo__image img {
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  object-position: 51% 48%;
}

.sd-photo__image-mark {
  position: absolute;
  z-index: 1;
  top: 18px;
  left: 18px;
  padding: 8px 11px;
  background: var(--photo-paper-light);
  color: var(--photo-ink);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
}

.sd-photo__figure figcaption {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 5px 16px;
  padding: 15px 1px 0;
  color: var(--photo-muted);
  font-size: 11px;
}

.sd-photo__figure figcaption span:last-child {
  color: #0e7f76;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.sd-photo__bottomline {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 15px;
  margin-top: clamp(42px, 6vw, 82px);
  padding-top: 15px;
  border-top: 1px solid var(--photo-line);
  color: #637176;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.sd-photo__rule {
  width: 52px;
  height: 1px;
  background: #bd7547;
}

@media (max-width: 760px) {
