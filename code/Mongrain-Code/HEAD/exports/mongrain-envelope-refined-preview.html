&lt;html lang="en"&gt;
&lt;head&gt;
&lt;meta charset="utf-8"&gt;
&lt;meta name="viewport" content="width=device-width,initial-scale=1"&gt;
&lt;title&gt;Mongrain — 03 Envelope assembly · BIM section&lt;/title&gt;
&lt;link rel="preconnect" href="https://fonts.googleapis.com"&gt;
&lt;link rel="preconnect" href="https://fonts.gstatic.com" crossorigin&gt;
&lt;link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&amp;family=Questrial&amp;display=swap" rel="stylesheet"&gt;
&lt;style&gt;
html,body{margin:0;padding:0;background:#EEF3F7}
#mg-bim{
  --mist:#EEF3F7;--ink:#0B1A28;--ink-2:#0E1F30;--graphite:#4A5868;--line:#D9E2EA;
  --cyan:#19C6F5;--royal:#0B6FD6;--amber:#FF8A3D;--grad:linear-gradient(120deg,#19C6F5 0%,#0B6FD6 100%);
  --f-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;--f-body:'Questrial',ui-sans-serif,system-ui,sans-serif;--f-mono:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --tx:0;--ty:0;--e:0;--mx:50%;--my:30%;
  background:var(--mist);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased
}
#mg-bim *,#mg-bim *::before,#mg-bim *::after{box-sizing:border-box}
#mg-bim a{color:inherit}
#mg-bim :focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:10px}
#mg-bim .sec{padding:24px 0 96px}
#mg-bim .stagewrap{width:min(1560px,calc(100vw - 32px));margin:0 auto;perspective:2400px}
#mg-bim .rise{opacity:0;transform:translateY(60px) scale(.96);filter:blur(8px);transition:opacity 1.2s var(--ease),transform 1.4s var(--ease),filter 1.2s var(--ease)}
#mg-bim.in .rise{opacity:1;transform:none;filter:none}

/* Shell */
#mg-bim .shell{position:relative;border-radius:30px;padding:1.5px;isolation:isolate;
  transform:rotateX(calc(var(--e)*12deg + var(--ty)*-1.2deg)) rotateY(calc(var(--tx)*1.4deg)) scale(calc(1 - var(--e)*.05));transform-origin:50% 0;
  transition:transform .6s var(--ease);
  box-shadow:0 2px 6px rgba(11,26,40,.12),0 40px 80px -30px rgba(11,26,40,.55),0 90px 140px -60px rgba(11,111,214,.45)}
#mg-bim .shell::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;
  background:conic-gradient(from var(--ang,0deg),rgba(25,198,245,.9),rgba(11,111,214,.35) 18%,rgba(11,26,40,.9) 40%,rgba(11,26,40,.9) 60%,rgba(11,111,214,.35) 82%,rgba(25,198,245,.9));animation:mgSpin 12s linear infinite}
#mg-bim .cn{position:relative;border-radius:28.5px;background:var(--ink);color:#DDE8F1;overflow:hidden}

/* Bar */
#mg-bim .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:10px 14px 10px 20px;border-bottom:1px solid rgba(255,255,255,.07);flex-wrap:wrap}
#mg-bim .crumb{display:flex;align-items:center;gap:10px;color:#8FA6BA;min-width:0;white-space:nowrap;overflow:hidden;font:500 13px/1 var(--f-mono)}
#mg-bim .crumb i{width:26px;height:26px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff;font:700 13px/1 var(--f-display);font-style:normal;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px -6px rgba(25,198,245,.8);flex-shrink:0}
#mg-bim .crumb em{font-style:normal;color:#E8F2F9}
#mg-bim .crumb s{text-decoration:none;opacity:.4}
#mg-bim .ctrls{display:flex;gap:8px;flex-wrap:wrap}
#mg-bim .cbtn{display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#C5D6E4;font:500 12.5px/1 var(--f-mono);letter-spacing:.02em;cursor:pointer;
  transition:border-color .3s,background .3s,color .3s,transform .5s var(--spring),box-shadow .4s}
#mg-bim .cbtn:hover{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;transform:translateY(-1px)}
#mg-bim .cbtn svg{width:14px;height:14px}
#mg-bim .cbtn.primary{background:#fff;color:var(--ink);border-color:#fff;box-shadow:0 10px 24px -10px rgba(25,198,245,.7)}
#mg-bim .cbtn.primary:hover{background:#E4F6FD;color:var(--ink)}
#mg-bim .cbtn.on{border-color:rgba(25,198,245,.55);color:#9FE3FA;background:rgba(25,198,245,.1)}

/* Body */
#mg-bim .body{display:grid;grid-template-columns:minmax(0,1fr) 392px;height:720px}
#mg-bim .stage{position:relative;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse 70% 60% at 50% 45%,#16304A 0%,#0E1F30 55%,#0A1726 100%)}
#mg-bim .stage.drag{cursor:grabbing}
#mg-bim .stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(143,166,186,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(143,166,186,.06) 1px,transparent 1px);background-size:40px 40px;
  -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 30%,transparent 80%)}
#mg-bim .view{position:absolute;inset:0;perspective:2600px;perspective-origin:50% 45%}
#mg-bim .cam{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
#mg-bim .model,#mg-bim .layer,#mg-bim .bx{position:absolute;left:0;top:0;transform-style:preserve-3d}
#mg-bim .layer{--c:var(--base);transition:transform 1.1s cubic-bezier(.22,.9,.24,1)}
#mg-bim .fc{position:absolute;left:0;top:0;transform-origin:0 0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:inset 0 0 0 .6px rgba(255,255,255,.14);transition:background-color .45s,opacity .45s,box-shadow .45s}
#mg-bim .f-fr{background-color:var(--c)}
#mg-bim .f-rt,#mg-bim .f-lf{background-color:color-mix(in srgb,var(--c) 74%,#06111c)}
#mg-bim .f-tp{background-color:color-mix(in srgb,var(--c) 78%,#fff)}
#mg-bim .f-bk{background-color:color-mix(in srgb,var(--c) 66%,#06111c)}
#mg-bim .f-bt{background-color:color-mix(in srgb,var(--c) 55%,#06111c)}
#mg-bim .t-cut .f-fr{background-image:repeating-linear-gradient(45deg,rgba(11,26,40,.22) 0 1px,transparent 1px 7px)}
#mg-bim .t-ins .fc{background-image:repeating-linear-gradient(0deg,rgba(11,26,40,.10) 0 1px,transparent 1px 5px)}
#mg-bim .t-ins .f-fr{background-image:repeating-linear-gradient(-30deg,rgba(11,26,40,.16) 0 1px,transparent 1px 6px),repeating-linear-gradient(30deg,rgba(11,26,40,.16) 0 1px,transparent 1px 6px)}
#mg-bim .t-dimple .fc{background-image:radial-gradient(circle,rgba(255,255,255,.22) 1.2px,transparent 1.6px);background-size:7px 7px}
#mg-bim .t-panel .f-rt{background-image:linear-gradient(180deg,rgba(255,255,255,.10),transparent 40%,rgba(0,0,0,.12))}
#mg-bim .t-perf .fc{background-image:radial-gradient(circle,rgba(6,17,28,.55) 1.1px,transparent 1.5px);background-size:6px 6px}
#mg-bim .t-ghost .fc{background-color:rgba(25,198,245,.035)!important;box-shadow:inset 0 0 0 1px rgba(143,166,186,.22)}
#mg-bim .layer.hl{--c:color-mix(in srgb,var(--base) 30%,#19C6F5)}
#mg-bim .layer.hl .fc{box-shadow:inset 0 0 0 .8px rgba(190,240,255,.9)}
#mg-bim .layer.hl.t-ghost .fc{background-color:rgba(25,198,245,.16)!important;box-shadow:inset 0 0 0 1px rgba(25,198,245,.8)}
#mg-bim .model.focus .layer:not(.hl) .fc{opacity:.16}
#mg-bim .layer.flash .fc{animation:mgFlash 1s ease-out}
#mg-bim .grade{position:absolute;left:0;top:0;transform-style:preserve-3d}
#mg-bim .grade .fc{background:rgba(143,166,186,.07);box-shadow:inset 0 0 0 1px rgba(143,166,186,.16)}

/* HUD */
#mg-bim .tag{position:absolute;left:20px;top:20px;z-index:2;display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:rgba(11,26,40,.6);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);font:500 11px/1 var(--f-mono);letter-spacing:.06em;color:#8FA6BA;pointer-events:none}
#mg-bim .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:mgBlink 1.6s ease-in-out infinite}
#mg-bim .hud{position:absolute;left:20px;right:20px;bottom:18px;z-index:2;display:flex;flex-direction:column;gap:10px;pointer-events:none}
#mg-bim .now{font:500 12px/1.3 var(--f-mono);color:#C5D6E4;letter-spacing:.02em;min-height:16px;transition:opacity .3s}
#mg-bim .now b{color:var(--cyan);font-weight:500}
#mg-bim .phases{display:grid;grid-template-columns:8fr 10fr 6fr;gap:6px}
#mg-bim .ph{display:flex;flex-direction:column;gap:7px;font:500 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#6B8196;transition:color .4s}
#mg-bim .ph i{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
#mg-bim .ph i::after{content:"";display:block;height:100%;width:calc(var(--p,0)*100%);background:var(--grad);border-radius:3px;transition:width .3s linear}
#mg-bim .ph.on{color:#DDE8F1}
#mg-bim .hint{position:absolute;right:20px;top:22px;z-index:2;font:500 11px/1 var(--f-mono);color:#6B8196;pointer-events:none;transition:opacity .5s}
#mg-bim .callout{position:absolute;left:0;top:0;z-index:4;width:270px;padding:14px 16px 15px;border-radius:18px;pointer-events:none;
  background:rgba(14,31,48,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(25,198,245,.35);
  box-shadow:0 24px 50px -20px rgba(0,0,0,.8),0 0 0 6px rgba(25,198,245,.05);opacity:0;transform:translate(var(--cx,0),var(--cy,0)) scale(.94);transform-origin:0 0;
  transition:opacity .25s var(--ease),transform .18s var(--ease)}
#mg-bim .callout.show{opacity:1;transform:translate(var(--cx,0),var(--cy,0)) scale(1)}
#mg-bim .callout .k{display:flex;justify-content:space-between;font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#7FD8F7}
#mg-bim .callout .k span+span{color:#6B8196}
#mg-bim .callout h5{margin:9px 0 6px;font:600 16px/1.2 var(--f-display);letter-spacing:-.015em;color:#fff}
#mg-bim .callout p{margin:0;font-size:12.5px;line-height:1.5;color:#A9BCCC}
#mg-bim .callout .s{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.08);font:500 11px/1.4 var(--f-mono);color:#DDE8F1}
#mg-bim .callout .c{margin-top:8px;font:500 10px/1 var(--f-mono);letter-spacing:.06em;color:#6B8196;text-transform:uppercase}

/* Sidebar */
#mg-bim .side{display:flex;flex-direction:column;min-height:0;border-left:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 50%)}
#mg-bim .cap{font:500 10.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:#6B8196}
#mg-bim .cats{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
#mg-bim .cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
#mg-bim .cat{display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:12px 11px 11px;border-radius:16px;border:0;background:rgba(255,255,255,.035);color:#A9BCCC;cursor:pointer;text-align:left;font:500 11.5px/1.2 var(--f-body);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:transform .5s var(--spring),background .3s,color .3s,box-shadow .4s}
#mg-bim .cat svg{width:20px;height:20px;color:#7F97AC;transition:color .3s,transform .5s var(--spring)}
#mg-bim .cat:hover{transform:translateY(-3px);background:rgba(255,255,255,.06);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 14px 26px -16px rgba(25,198,245,.6)}
#mg-bim .cat:hover svg{transform:scale(1.12) rotate(-4deg);color:#BFEFFF}
#mg-bim .cat[aria-pressed="true"]{background:rgba(25,198,245,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(25,198,245,.55),0 14px 30px -14px rgba(25,198,245,.7)}
#mg-bim .cat[aria-pressed="true"] svg{color:var(--cyan)}
#mg-bim .detail{padding:20px;border-bottom:1px solid rgba(255,255,255,.07);min-height:248px;display:flex;flex-direction:column}
#mg-bim .detail .swap{transition:opacity .35s var(--ease),transform .45s var(--ease),filter .35s;transition-delay:calc(var(--k,0)*50ms)}
#mg-bim .detail.out .swap{opacity:0;transform:translateY(8px);filter:blur(3px);transition-delay:0s}
#mg-bim .dtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
#mg-bim .chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;background:rgba(25,198,245,.12);color:#9FE3FA;font:500 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
#mg-bim .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
#mg-bim .lock{font:500 10.5px/1 var(--f-mono);color:#6B8196;display:inline-flex;gap:6px;align-items:center}
#mg-bim .detail h4{margin:14px 0 8px;font:600 21px/1.15 var(--f-display);letter-spacing:-.02em;color:#fff;text-wrap:balance}
#mg-bim .detail p{margin:0;font-size:13.5px;line-height:1.55;color:#A9BCCC;text-wrap:pretty}
#mg-bim .specs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#mg-bim .specs span{padding:6px 9px;border-radius:9px;background:rgba(255,255,255,.05);font:500 10.5px/1 var(--f-mono);color:#DDE8F1}
#mg-bim .go{position:relative;overflow:hidden;align-self:flex-start;margin-top:auto;display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px;border-radius:14px;background:#fff;color:var(--ink);font:500 13.5px/1 var(--f-body);text-decoration:none;
  box-shadow:0 12px 26px -12px rgba(25,198,245,.6);transition:transform .5s var(--spring),box-shadow .4s,opacity .3s}
#mg-bim .go::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(25,198,245,.35),transparent);transform:skewX(-20deg);transition:left .8s var(--ease)}
#mg-bim .go:hover{box-shadow:0 18px 34px -12px rgba(25,198,245,.85)}
#mg-bim .go:hover::after{left:130%}
#mg-bim .go svg{transition:transform .4s var(--spring)}
#mg-bim .go:hover svg{transform:translateX(4px)}
#mg-bim .go[hidden]{display:none}
#mg-bim .gowrap{margin-top:auto;padding-top:14px}
#mg-bim .legend{flex:1;min-height:0;overflow:auto;padding:14px 12px 18px;scrollbar-width:thin;scrollbar-color:#2A4058 transparent}
#mg-bim .grp{margin-top:8px}
#mg-bim .grp .cap{display:flex;justify-content:space-between;padding:8px 10px}
#mg-bim .li{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:0;border-radius:11px;background:transparent;color:#A9BCCC;font:500 13px/1.25 var(--f-body);text-align:left;cursor:pointer;transition:background .25s,color .25s,transform .4s var(--spring)}
#mg-bim .li i{width:12px;height:12px;flex-shrink:0;border-radius:4px;background:var(--base);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
#mg-bim .li code{margin-left:auto;font:500 10px/1 var(--f-mono);color:#56708A}
#mg-bim .li:hover{background:rgba(255,255,255,.05);color:#fff;transform:translateX(3px)}
#mg-bim .li.hl{background:rgba(25,198,245,.1);color:#fff}
#mg-bim .li.hl i{box-shadow:0 0 0 2px rgba(25,198,245,.6),0 0 10px rgba(25,198,245,.6)}
#mg-bim .li.hl code{color:var(--cyan)}
#mg-bim .li.dim{opacity:.4}

/* lighting + materials */
#mg-bim .fc::after{content:"";position:absolute;inset:0;pointer-events:none;transition:opacity .5s}
#mg-bim .f-fr::after{background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,0) 42%,rgba(0,0,0,.22))}
#mg-bim .f-rt::after{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 30%,rgba(0,0,0,.28))}
#mg-bim .f-tp::after{background:linear-gradient(120deg,rgba(255,255,255,.26),rgba(255,255,255,0) 55%)}
#mg-bim .f-tp{box-shadow:inset 0 0 0 .7px rgba(255,255,255,.34)}
#mg-bim .t-panel .f-rt::after{background:linear-gradient(172deg,rgba(255,240,220,.30),rgba(255,255,255,0) 30%,rgba(0,0,0,.05) 60%,rgba(0,0,0,.32))}
#mg-bim .layer.gone .fc{opacity:0!important}
#mg-bim .layer.wire .fc{background-color:rgba(25,198,245,.035)!important;background-image:none!important;box-shadow:inset 0 0 0 .8px rgba(25,198,245,.75)!important}
#mg-bim .layer.wire .fc::after{opacity:0}
#mg-bim .fc{transition:background-color .7s,opacity .6s,box-shadow .7s}
/* context */
#mg-bim .soil,#mg-bim .shadow,#mg-bim .scan,#mg-bim .lvl,#mg-bim .gline{position:absolute;left:0;top:0;transform-style:preserve-3d;pointer-events:none}
#mg-bim .soil .fc{background-color:rgba(120,145,170,.045)!important;box-shadow:none;transition:opacity .9s}
#mg-bim .soil .fc::after{display:none}
#mg-bim .soil .f-fr{background-image:repeating-linear-gradient(45deg,rgba(143,166,186,.10) 0 1px,transparent 1px 10px)}
#mg-bim .soil .f-tp{background:linear-gradient(90deg,rgba(25,198,245,.12),rgba(25,198,245,0) 80%)!important}
#mg-bim .shadow .fc{background:radial-gradient(ellipse 50% 46% at 42% 50%,rgba(0,6,14,.75),rgba(0,6,14,0) 70%);box-shadow:none}
#mg-bim .shadow .fc::after{display:none}
#mg-bim .gline{width:420px;height:1.5px;background:linear-gradient(90deg,rgba(25,198,245,.9),rgba(25,198,245,0));box-shadow:0 0 10px rgba(25,198,245,.7);transition:opacity .9s}
#mg-bim .lvl{transition:opacity .9s}
#mg-bim .lvl i{display:block;height:0;border-top:1px dashed rgba(143,166,186,.38)}
