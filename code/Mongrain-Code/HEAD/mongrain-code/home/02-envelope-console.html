<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mongrain — 02 Interactive envelope console</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Geist:wght@400..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"><style>html,body{margin:0;padding:0;background:#EEF3F7}/* Mongrain design tokens: shared by every embed */
#mg-envelope-console{
  --mist:#EEF3F7;
  --paper:#FFFFFF;
  --ink:#0B1A28;
  --ink-2:#0E1F30;
  --graphite:#4A5868;
  --line:#D9E2EA;
  --cyan:#19C6F5;
  --royal:#0B6FD6;
  --amber:#FF8A3D;
  --grad:linear-gradient(120deg,#19C6F5 0%,#0B6FD6 100%);
  --f-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Geist',ui-sans-serif,system-ui,sans-serif;
  --f-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --max:1200px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
#mg-envelope-console *,#mg-envelope-console *::before,#mg-envelope-console *::after{box-sizing:border-box}
#mg-envelope-console{margin:0;padding:0}
#mg-envelope-console{background:var(--page-bg,var(--mist));color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#mg-envelope-console img{display:block;max-width:100%}
#mg-envelope-console a{color:inherit}
#mg-envelope-console .wrap{max-width:var(--max);margin:0 auto;padding:0 32px}
#mg-envelope-console .sec{padding:120px 0}
#mg-envelope-console .eyebrow{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--graphite);margin:0 0 20px}
#mg-envelope-console .h2{font-family:var(--f-display);font-weight:600;font-size:clamp(34px,4.6vw,60px);line-height:1.02;letter-spacing:-.035em;margin:0}
#mg-envelope-console .lede{font-size:clamp(17px,1.4vw,19px);color:var(--graphite);max-width:56ch;margin:20px 0 0}
#mg-envelope-console .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#mg-envelope-console .btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:12px;font:500 15px/1 var(--f-body);text-decoration:none;white-space:nowrap;border:1px solid transparent;cursor:pointer;transition:background .25s var(--ease),border-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease)}
#mg-envelope-console .btn svg{transition:transform .25s var(--ease)}
#mg-envelope-console .btn:hover svg{transform:translateX(3px)}
#mg-envelope-console .btn-primary{background:var(--ink);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 30px -10px rgba(11,111,214,.55)}
#mg-envelope-console .btn-primary:hover{background:var(--royal)}
#mg-envelope-console .btn-ghost{background:var(--paper);color:var(--ink);border-color:var(--line)}
#mg-envelope-console .btn-ghost:hover{border-color:#AFC0CF}
#mg-envelope-console .btn-light{background:#fff;color:var(--ink)}
#mg-envelope-console .btn-light:hover{background:#E4F6FD}
#mg-envelope-console .btn-outline-light{color:#fff;border-color:rgba(255,255,255,.22)}
#mg-envelope-console .btn-outline-light:hover{border-color:rgba(255,255,255,.5)}
#mg-envelope-console :focus-visible{outline:2px solid var(--royal);outline-offset:3px;border-radius:8px}
#mg-envelope-console .mono{font-family:var(--f-mono)}
#mg-envelope-console [data-reveal]{opacity:0;transform:translateY(18px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
#mg-envelope-console [data-reveal].in{opacity:1;transform:none}
@media (max-width:760px){
#mg-envelope-console .wrap{padding:0 20px}
#mg-envelope-console .sec{padding:84px 0}}
@media (prefers-reduced-motion:reduce){
#mg-envelope-console [data-reveal]{opacity:1;transform:none;transition:none}
#mg-envelope-console *,#mg-envelope-console *::before,#mg-envelope-console *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
#mg-envelope-console{--page-bg:var(--mist)}/* Console window */
#mg-envelope-console .console{margin-top:72px;width:min(1560px,calc(100vw - 48px));margin-left:calc(50% - min(780px,calc(50vw - 24px)));border-radius:22px;padding:1px;background:linear-gradient(160deg,rgba(25,198,245,.55),rgba(11,111,214,.25) 30%,rgba(11,26,40,.9) 70%);box-shadow:0 60px 120px -40px rgba(11,26,40,.55),0 20px 40px -20px rgba(11,111,214,.35)}
#mg-envelope-console .cn{border-radius:19px;background:var(--ink);color:#DDE8F1;overflow:hidden}
#mg-envelope-console .cn-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 16px 0 18px;border-bottom:1px solid rgba(255,255,255,.07);font:500 13px/1 var(--f-mono)}
#mg-envelope-console .cn-crumb{display:flex;align-items:center;gap:10px;color:#8FA6BA;min-width:0;white-space:nowrap;overflow:hidden}
#mg-envelope-console .cn-crumb i{width:22px;height:22px;border-radius:6px;background:var(--grad);display:grid;place-items:center;color:#fff;font:700 12px/1 var(--f-display);font-style:normal;box-shadow:inset 0 1px 0 rgba(255,255,255,.4);flex-shrink:0}
#mg-envelope-console .cn-crumb em{font-style:normal;color:#E8F2F9}
#mg-envelope-console .cn-crumb s{text-decoration:none;opacity:.4}
#mg-envelope-console .cn-play{white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:#C5D6E4;font:500 12px/1 var(--f-mono);cursor:pointer}
#mg-envelope-console .cn-play:hover{border-color:rgba(255,255,255,.25)}
#mg-envelope-console .cn-play .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 3px rgba(25,198,245,.2)}
#mg-envelope-console .cn-play[aria-pressed="true"] .dot{background:#6B8196;box-shadow:none}
#mg-envelope-console .cn-body{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto 1fr}
#mg-envelope-console .cn-nav{grid-column:1/-1;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}
#mg-envelope-console .cn-nav::-webkit-scrollbar{display:none}
#mg-envelope-console .cn-nav .cap{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#6B8196;padding:0 14px 0 8px;flex-shrink:0}
#mg-envelope-console .cn-tab{position:relative;display:flex;align-items:center;gap:10px;flex-shrink:0;white-space:nowrap;padding:12px 14px;border:0;border-radius:10px;background:transparent;color:#A9BCCC;font:500 14px/1.2 var(--f-body);text-align:left;cursor:pointer;overflow:hidden;transition:background .2s,color .2s}
#mg-envelope-console .cn-tab:hover{background:rgba(255,255,255,.04);color:#fff}
#mg-envelope-console .cn-tab code{font:500 11px/1 var(--f-mono);flex-shrink:0;color:#6B8196;transition:color .2s}
#mg-envelope-console .cn-tab[aria-selected="true"]{background:rgba(25,198,245,.08);color:#fff}
#mg-envelope-console .cn-tab[aria-selected="true"] code{color:var(--cyan)}
#mg-envelope-console .cn-tab[data-tone="fire"][aria-selected="true"]{background:rgba(255,138,61,.09)}
#mg-envelope-console .cn-tab[data-tone="fire"][aria-selected="true"] code{color:var(--amber)}
#mg-envelope-console .cn-tab .bar{position:absolute;left:10px;right:10px;bottom:3px;height:2px;border-radius:2px;background:rgba(255,255,255,.06);opacity:0}
#mg-envelope-console .cn-tab .bar::after{content:"";position:absolute;inset:0;border-radius:2px;background:var(--grad);transform-origin:left;transform:scaleX(0)}
#mg-envelope-console .cn.touring .cn-tab[aria-selected="true"] .bar{opacity:1}
#mg-envelope-console .cn.touring .cn-tab[aria-selected="true"] .bar::after{animation:cnfill var(--tour,5.5s) linear forwards}
@keyframes cnfill{to{transform:scaleX(1)}}
#mg-envelope-console .cn-foot{margin-left:auto;padding:0 8px 0 16px;flex-shrink:0;white-space:nowrap;font:500 11px/1 var(--f-mono);color:#6B8196}
#mg-envelope-console .cn-foot b{color:#C5D6E4;font-weight:500}
#mg-envelope-console .cn-draw{position:relative;background:var(--ink-2);display:flex;align-items:center;justify-content:center;padding:52px 20px 40px}
#mg-envelope-console .cn-draw .tag{position:absolute;left:22px;top:20px;font:500 12px/1 var(--f-mono);letter-spacing:.06em;color:#6B8196}
#mg-envelope-console .cn-draw .scale{position:absolute;right:18px;bottom:16px;display:flex;align-items:center;gap:8px;font:500 10px/1 var(--f-mono);color:#6B8196}
#mg-envelope-console .cn-draw .scale i{display:block;width:48px;height:5px;border:1px solid #4A6480;border-top:0}
#mg-envelope-console .dw{width:100%;height:auto;display:block}
#mg-envelope-console .dw .lab{font:500 9px var(--f-mono);letter-spacing:.08em;fill:#5B7690}
#mg-envelope-console .dw .base rect{fill:#1A3149;stroke:#36526E;stroke-width:1}
#mg-envelope-console .dw .layer{--s:#4E6883;--f:rgba(78,104,131,.18);cursor:pointer;transition:opacity .5s var(--ease)}
#mg-envelope-console .dw .layer .f{fill:var(--f);stroke:var(--s);stroke-width:1;transition:fill .5s,stroke .5s}
#mg-envelope-console .dw .layer .ln{fill:none;stroke:var(--s);stroke-width:2;transition:stroke .5s}
#mg-envelope-console .dw .layer .dash{fill:none;stroke:var(--s);stroke-width:1;stroke-dasharray:3 3}
#mg-envelope-console .dw .layer .foam{color:var(--s)}
#mg-envelope-console .dw[data-active] .layer{opacity:.42}
#mg-envelope-console .dw .layer.on{opacity:1;--s:#19C6F5;--f:rgba(25,198,245,.2)}
#mg-envelope-console .dw .layer.on[data-tone="fire"]{--s:#FF8A3D;--f:rgba(255,138,61,.22)}
#mg-envelope-console .dw .layer.on .glow{filter:url(#glow)}
#mg-envelope-console .dw .co{opacity:0;transition:opacity .4s var(--ease)}
#mg-envelope-console .dw .co line{stroke:var(--s);stroke-width:1}
#mg-envelope-console .dw .co circle{fill:var(--s)}
#mg-envelope-console .dw .co text{font:500 10px var(--f-mono);letter-spacing:.01em;fill:#D8ECF7}
#mg-envelope-console .dw .layer.on .co{opacity:1;transition-delay:.15s}
#mg-envelope-console .cn-spec{padding:30px 30px 26px;border-left:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column}
#mg-envelope-console .cn-spec .top{display:flex;justify-content:space-between;align-items:center}
#mg-envelope-console .chip{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 10px;border-radius:999px;background:rgba(25,198,245,.1);color:#9FE3FA;font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
#mg-envelope-console .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
#mg-envelope-console .cn-spec[data-tone="fire"] .chip{background:rgba(255,138,61,.12);color:#FFB27F}
#mg-envelope-console .cn-spec .code{font:500 12px/1 var(--f-mono);color:#6B8196}
#mg-envelope-console .cn-spec h3{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.1;letter-spacing:-.025em;color:#fff;margin:18px 0 10px}
#mg-envelope-console .cn-spec p{margin:0;font-size:14.5px;line-height:1.55;color:#A9BCCC}
#mg-envelope-console .cn-spec .cap{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#6B8196;margin:22px 0 10px}
#mg-envelope-console .cn-spec ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
#mg-envelope-console .cn-spec li{display:flex;gap:10px;align-items:baseline;font:500 12.5px/1.35 var(--f-mono);color:#DDE8F1}
#mg-envelope-console .cn-spec li::before{content:"";width:5px;height:5px;flex-shrink:0;border-radius:1px;background:var(--cyan);transform:translateY(-2px)}
#mg-envelope-console .cn-spec[data-tone="fire"] li::before{background:var(--amber)}
#mg-envelope-console .cn-spec dl{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:22px 0 0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden}
#mg-envelope-console .cn-spec dl div{background:var(--ink);padding:11px 12px}
#mg-envelope-console .cn-spec dt{font:500 10px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#6B8196}
#mg-envelope-console .cn-spec dd{margin:5px 0 0;font:500 13.5px/1.25 var(--f-body);color:#fff}
#mg-envelope-console .cn-spec .go{margin-top:auto;padding-top:20px;display:inline-flex;align-items:center;gap:8px;font:500 14px/1 var(--f-body);color:#fff;text-decoration:none}
#mg-envelope-console .cn-spec .go svg{transition:transform .25s var(--ease)}
#mg-envelope-console .cn-spec .go:hover svg{transform:translateX(3px)}
#mg-envelope-console .cn-spec .swap{transition:opacity .35s var(--ease),transform .35s var(--ease)}
#mg-envelope-console .cn-spec.out .swap{opacity:0;transform:translateY(6px)}
@media (max-width:1100px){
#mg-envelope-console .cn-body{grid-template-columns:minmax(0,1fr)}
#mg-envelope-console .cn-foot{display:none}
#mg-envelope-console .cn-spec{grid-column:1/-1;border-left:0;border-top:1px solid rgba(255,255,255,.07);display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
#mg-envelope-console .cn-spec>.swap:first-child,#mg-envelope-console .cn-spec h3,#mg-envelope-console .cn-spec p{grid-column:1}
#mg-envelope-console .cn-spec .top{grid-column:1/-1}
}
@media (max-width:860px){
#mg-envelope-console .hero{padding:124px 0 72px}
#mg-envelope-console .hero-row{flex-direction:column;align-items:flex-start;gap:28px}
#mg-envelope-console .console{margin-top:48px}
#mg-envelope-console .console{width:auto;margin-left:0}
#mg-envelope-console .cn-nav .cap{display:none}
#mg-envelope-console .cn-tab{padding:10px 12px}
#mg-envelope-console .cn-spec{display:flex}
#mg-envelope-console .cn-draw{padding:40px 8px 28px}
#mg-envelope-console .dw .co{display:none}
}
@media (max-width:520px){
#mg-envelope-console .hero-ctas{flex-direction:column;align-self:stretch}
#mg-envelope-console .hero-ctas .btn{justify-content:center}
#mg-envelope-console .cn-crumb .hide-sm{display:none}
#mg-envelope-console .cn-play{padding:0 10px}
#mg-envelope-console .cn-spec{padding:22px 18px}
}
#mg-envelope-console .console-section{padding:24px 0 110px;background:var(--mist)}
#mg-envelope-console .console{margin-top:0}
@media(max-width:860px){
#mg-envelope-console .console-section{padding:24px 0 72px}
#mg-envelope-console .console{margin-top:0}}
